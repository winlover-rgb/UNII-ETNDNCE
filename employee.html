<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>UNII – Fingerprint Alert</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#C8202A;--ink:#2B2B2B;--bg:#F6F5F3;--line:#DDD9D3;--mut:#6B6862}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:#fff;border-bottom:4px solid var(--red);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header img{height:44px;max-width:60%}
header span{font-weight:700;color:var(--mut);font-size:15px}
main{max-width:880px;margin:0 auto;padding:22px 18px 40px}
h1{font-size:22px;margin:0 0 6px}p.s{margin:0 0 22px;color:var(--mut);font-size:15px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid #000;outline-offset:3px}
.cars{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:26px}
.car{background:#fff;border:1px solid var(--line);border-top:6px solid var(--ink);padding:14px 16px}
.car h3{margin:0 0 8px;font-size:17px}.car ul{list-style:none;margin:0;padding:0}
.car li{padding:7px 0;border-top:1px solid var(--line);font-size:16px;display:flex;justify-content:space-between}
.badge{background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:1px 8px}

.panel{background:#fff;border:1px solid var(--line);padding:20px;max-width:520px;margin:0 auto}
label{font-weight:700;display:block;margin-bottom:8px}
select{width:100%;font:inherit;font-size:18px;padding:12px;border:2px solid var(--ink);background:#fff;margin-bottom:18px}
.go{width:100%;border:0;background:var(--red);color:#fff;font-size:22px;font-weight:900;padding:18px}
#live{display:none;text-align:center}#live .dot{display:inline-block;width:12px;height:12px;background:#1B7F3B;border-radius:50%;margin-inline-start:8px}
#live b{font-size:20px}#live p{color:var(--mut);margin:10px 0 0}
#ov{position:fixed;inset:0;background:var(--red);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9;animation:fl .7s infinite alternate}
@keyframes fl{from{background:#C8202A}to{background:#7d1218}}
#ov img{background:#fff;padding:10px 16px;height:56px;max-width:80%;margin-bottom:28px}
#ov h2{font-size:clamp(30px,8vw,54px);font-weight:900;margin:0 0 18px;line-height:1.35}
#ov .m{font-size:clamp(20px,5vw,30px);font-weight:700;margin:0 0 14px}
#ov .c{background:#fff;color:var(--ink);font-size:clamp(20px,5vw,28px);font-weight:900;padding:8px 22px;margin-bottom:30px}
#ov button{background:#fff;color:var(--red);border:0;font-size:24px;font-weight:900;padding:16px 60px}
@media(prefers-reduced-motion:reduce){#ov{animation:none}}</style></head><body>

<h2 id="t1" dir="rtl" lang="ar"></h2><div class="m" dir="rtl" lang="ar">السيارات منتظرة أسفل المبنى</div><div class="c" id="car"></div><button id="ok">Done</button></div>
<script>
const TOPIC="unii-fp-k7x92qmv4d",CARS=[["Eng. Tamer Ali|RE", "Eng. Mahmoud Khalil", "Eng. Mohamed Magdy", "Eng. Mostafa Nour"], ["Eng. Mohamed Taher", "Eng. Milad Abdou", "Eng. Walid Farahat", "Eng. Mostafa Radwan"], ["Eng. Ahmed Raouf", "Eng. Abanoub Samir", "Eng. George Hany", "Eng. Ahmed Nashaat"]];
const me=document.getElementById('me');
CARS.forEach((c,i)=>c.forEach(n=>{const a=n.split('|')[0];me.add(new Option(a+' (Car '+(i+1)+')',a+'|'+(i+1)))}));
const saved=localStorage.getItem('unii_me');if(saved)me.value=saved;
let actx,wl,es,timer,playing=false;
function siren(sec){return new Promise(res=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sawtooth';g.gain.value=.9;o.connect(g);g.connect(actx.destination);
 const t=actx.currentTime;for(let i=0;i<sec*2;i++){o.frequency.setValueAtTime(650,t+i*.5);o.frequency.linearRampToValueAtTime(1250,t+i*.5+.45)}
 o.start();o.stop(t+sec);o.onended=res})}
function voice(txt){return new Promise(res=>{const u=new SpeechSynthesisUtterance(txt);u.lang='ar-SA';u.rate=.88;u.pitch=1.15;u.volume=1;
 const vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('ar'));
 u.voice=vs.find(v=>/laila|zariyah|hoda|salma|female|google/i.test(v.name))||vs[0]||null;
 u.onend=u.onerror=res;speechSynthesis.cancel();speechSynthesis.speak(u)})}
async function alarm(type){if(playing)return;playing=true;const word=type=='in'?'الدخول':'الخروج';
 for(let i=0;i<4&&playing;i++){await siren(2.5);if(!playing)break;await voice('السادة المهندسين استعدوا لبصمة '+word);if(!playing)break;await new Promise(r=>setTimeout(r,600))}playing=false}
function show(type){const w=type=='in'?'الدخول':'الخروج';const [n,car]=me.value.split('|');
 document.getElementById('t1').textContent='السادة المهندسين استعدوا لبصمة '+w;
 document.getElementById('car').textContent='Your car: No. '+car;
 document.getElementById('ov').style.display='flex';
 if(navigator.vibrate)navigator.vibrate([600,200,600,200,600,200,600]);
 if(document.hidden&&Notification.permission=='granted')try{new Notification('UNII – Fingerprint '+(type=='in'?'In':'Out'),{body:'Cars are waiting downstairs',requireInteraction:true})}catch(e){}
 alarm(type)}
document.getElementById('ok').onclick=()=>{playing=false;speechSynthesis.cancel();document.getElementById('ov').style.display='none'};
function connect(){if(es)es.close();es=new EventSource('https://ntfy.sh/'+TOPIC+'/sse');
 es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event!='message')return;if(Date.now()/1000-m.time>90)return;show(JSON.parse(m.message).type)}catch(x){}}}
async function lock(){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){lock();connect()}});
document.getElementById('act').onclick=async()=>{
 actx=new (window.AudioContext||window.webkitAudioContext)();await actx.resume();
 const s=new SpeechSynthesisUtterance(' ');s.volume=0;speechSynthesis.speak(s);
 try{await Notification.requestPermission()}catch(e){}
 localStorage.setItem('unii_me',me.value);lock();connect();
 document.getElementById('who').textContent=me.value.split('|')[0]+' – Car '+me.value.split('|')[1];
 document.getElementById('setup').style.display='none';document.getElementById('live').style.display='block';
 await siren(.6)};
</script></body></html>
